  <path d="M47 15l12 17-12 17" fill="none" stroke="#86aca6" stroke-width="4" stroke-linejoin="miter"/>
  <g fill="#0c1214">
    <rect x="15" y="22" width="7" height="20"/>
    <rect x="15" y="22" width="19" height="6"/>
    <rect x="15" y="29" width="14" height="6"/>
    <rect x="15" y="36" width="19" height="6"/>
  </g>
</svg>
